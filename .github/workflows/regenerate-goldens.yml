name: Regenerate goldens (Linux)
on:
  workflow_dispatch:
  push:
    branches: [release/velnix-completion]
permissions:
  contents: read
jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --update-goldens test/live_presentation_test.dart test/live_readiness_test.dart test/final_audit_visuals_test.dart test/arabic_controls_test.dart
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: regenerated-goldens
          path: |
            test/goldens/
          if-no-files-found: error
