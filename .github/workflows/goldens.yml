name: Regenerate Golden Baselines

# One-off helper: the golden PNGs are pinned to the Linux rasteriser used by
# the Validate Velnix flutter job. Regenerating them on macOS produces files
# that fail on CI, so this workflow runs the update on Ubuntu and commits the
# refreshed baselines back to the branch.
on:
  workflow_dispatch:
  push:
    branches: [audit/production-readiness]
    paths:
      - '.github/workflows/goldens.yml'

permissions:
  contents: write

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Update golden baselines on Linux
        run: flutter test --update-goldens
      - name: Commit refreshed baselines
        run: |
          git config user.name "velnix-ci"
          git config user.email "velnix-ci@users.noreply.github.com"
          git add test/goldens
          if git diff --cached --quiet; then
            echo "No golden changes"
          else
            git commit -m "test: refresh golden baselines on Linux"
            git push
          fi
